server {
    listen 80;
    server_name 39.106.55.218;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/xianqiji-updates/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name 39.106.55.218;
    ssl_certificate /etc/xianqiji-updates/tls/fullchain.pem;
    ssl_certificate_key /etc/xianqiji-updates/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/xianqiji-updates/public;
    autoindex off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    location = /music-updates/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location /music-updates/releases/ {
        gzip off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        try_files $uri =404;
    }
    location = /music-updates/health.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { return 404; }
    access_log /www/wwwlogs/xianqiji-updates-access.log combined;
    error_log /www/wwwlogs/xianqiji-updates-error.log warn;
}
